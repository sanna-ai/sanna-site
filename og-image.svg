<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f07356"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1017" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b1017"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#bar)"/>

  <!-- Brand lockup: aperture mark + wordmark -->
  <g transform="translate(80, 70)">
    <g transform="scale(0.6)">
      <circle cx="50" cy="50" r="44" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <path d="M 50 50 L 50 10 L 68 20 Z" fill="#38bdf8"/>
      <path d="M 50 50 L 84.6 30 L 84.6 50 Z" fill="#a78bfa"/>
      <path d="M 50 50 L 84.6 70 L 68 80 Z" fill="#f07356"/>
      <path d="M 50 50 L 50 90 L 32 80 Z" fill="#38bdf8"/>
      <path d="M 50 50 L 15.4 70 L 15.4 50 Z" fill="#a78bfa"/>
      <path d="M 50 50 L 15.4 30 L 32 20 Z" fill="#f07356"/>
      <circle cx="50" cy="50" r="8" fill="#0b1017"/>
    </g>
    <text x="78" y="48" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="300" fill="#ffffff" letter-spacing="-1.5">sanna<tspan fill="#38bdf8">.</tspan></text>
  </g>

  <!-- Headline -->
  <text x="80" y="312" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-2.5">AI Agent Governance</text>
  <text x="80" y="402" font-family="Helvetica, Arial, sans-serif" font-size="78" font-weight="300" fill="#8899ad" letter-spacing="-2.5">Enforced and Proven</text>

  <!-- Subline -->
  <text x="82" y="478" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#8899ad">Constitution enforcement + Ed25519 governance receipts. Open source.</text>

  <!-- Footer row -->
  <rect x="80" y="556" width="44" height="3" rx="1.5" fill="url(#bar)"/>
  <text x="80" y="552" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">sanna.dev</text>
  <text x="1120" y="552" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#556677">Python · TypeScript · AGPL-3.0</text>
